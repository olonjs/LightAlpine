<!doctype html>
<html lang="en">
  <head>
    <!-- localStorage key must match THEME_STORAGE_KEY in src/components/ThemeProvider.tsx -->
    <script>
      (function () {
        var k = 'olon:theme';
        try {
          var v = localStorage.getItem(k);
          if (v === 'light' || v === 'dark') {
            document.documentElement.setAttribute('data-theme', v);
            return;
          }
        } catch (e) {}
        try {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.setAttribute('data-theme', 'light');
            return;
          }
        } catch (e2) {}
        document.documentElement.setAttribute('data-theme', 'dark');
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Alpine Retreat - Luxury Eco-Resort in the Dolomites</title>
    <meta name="description" content="Experience unparalleled luxury in the heart of the Italian Dolomites. Premium eco-resort featuring world-class spa, Michelin-starred dining, and exclusive alpine adventures." />
    <style>
      @media (prefers-reduced-motion: no-preference) {
        ::view-transition-old(root) { animation: 220ms ease-out both vt-fade-out; }
        ::view-transition-new(root) { animation: 220ms ease-in  both vt-fade-in; }
        @keyframes vt-fade-out { from { opacity: 1; } to { opacity: 0; } }
        @keyframes vt-fade-in  { from { opacity: 0; } to { opacity: 1; } }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
